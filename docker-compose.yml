# Docker Compose definition for Coolify (build pack "Docker Compose"), also usable with
# plain `docker compose up --build` for a local trial (see the notes at the bottom).
services:
  intesa:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # A small init process forwards stop signals so the server can close the database cleanly.
    init: true
    stop_grace_period: 10s
    environment:
      # Coolify "magic" variables: declaring SERVICE_FQDN_<NAME>_<PORT> makes Coolify generate a
      # domain for this service and route it to that container port; SERVICE_URL_<NAME> is the
      # matching full URL (with https://) that Coolify fills in for us.
      - SERVICE_FQDN_INTESA_3000
      - PUBLIC_URL=${SERVICE_URL_INTESA:-http://localhost:3000}
      - NODE_ENV=production
      - PORT=3000
      # Required: the dev login is disabled in production, so Google is the only way in.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?set the Google OAuth client id}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:?set the Google OAuth client secret}
      # Optional: set a postgres:// URL to use PostgreSQL instead of the SQLite file in /data
      # (see the commented postgres service below for a ready-made URL).
      - DATABASE_URL=${DATABASE_URL:-/data/intesa.db}
    volumes:
      - intesa-data:/data
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    # Uncomment when using the postgres service below:
    # depends_on:
    #   postgres:
    #     condition: service_healthy

  # Optional PostgreSQL. To use it, uncomment this service, the volume below, the depends_on
  # block above, and change the intesa DATABASE_URL line to:
  #   - DATABASE_URL=postgres://intesa:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/intesa
  # Coolify generates SERVICE_PASSWORD_POSTGRES once and uses it for both services.
  #
  # postgres:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_USER=intesa
  #     - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
  #     - POSTGRES_DB=intesa
  #   volumes:
  #     - intesa-pg:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U intesa -d intesa"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5

volumes:
  intesa-data:
  # intesa-pg:

# Local trial: Coolify routes traffic itself, so no ports are published above. To try this file
# on a laptop, add `ports: ["3000:3000"]` to the intesa service and run it with
#   SERVICE_URL_INTESA=http://localhost:3000 \
#   GOOGLE_CLIENT_ID=... GOOGLE_CLIENT_SECRET=... docker compose up --build
